<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="utf-8">
  <title>PPTAgent · 新建演示</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #F6F5F2; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; color: #211F1C; }
    a { color: oklch(0.45 0.11 272); text-decoration: none; }
    a:hover { color: oklch(0.38 0.11 272); }
    textarea { font-family: inherit; }
    input[type=range] { accent-color: oklch(0.45 0.11 272); }
    ::placeholder { color: #A9A399; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</helmet>

<div style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Top nav -->
  <header style="height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; background: rgba(246,245,242,0.9); border-bottom: 1px solid #E7E4DD; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(8px);">
    <div style="display: flex; align-items: center; gap: 28px;">
      <a href="Create.dc.html" style="display: flex; align-items: center; gap: 10px; color: #211F1C;">
        <span style="position: relative; width: 22px; height: 22px; display: inline-block;">
          <span style="position: absolute; left: 0; top: 4px; width: 16px; height: 12px; border-radius: 3px; background: oklch(0.82 0.05 272); display: block;"></span>
          <span style="position: absolute; left: 5px; top: 0; width: 16px; height: 12px; border-radius: 3px; background: oklch(0.45 0.11 272); display: block;"></span>
        </span>
        <span style="font-family: Sora, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.01em;">PPTAgent</span>
      </a>
      <nav style="display: flex; gap: 4px;">
        <a href="Create.dc.html" style="padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; color: #211F1C; background: #ECEAE4;">创建</a>
        <a href="Templates.dc.html" style="padding: 6px 14px; border-radius: 8px; font-size: 14px; color: #6B665D;" style-hover="background: #ECEAE4; color: #211F1C;">模板库</a>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="#" style="font-size: 13px; color: #6B665D;">帮助</a>
      <span style="width: 30px; height: 30px; border-radius: 50%; background: oklch(0.45 0.11 272); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500;">李</span>
    </div>
  </header>

  <!-- Main -->
  <main style="flex: 1; display: flex; justify-content: center; padding: 48px 24px 80px;">
    <div style="width: 100%; max-width: 820px; animation: fadeUp .5s ease;">

      <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em;">新建演示</h1>
      <p style="margin: 0 0 32px; font-size: 14px; color: #8B857B;">描述你的主题，选择模板，剩下的交给 AI。</p>

      <!-- Topic -->
      <section style="background: #FFFFFF; border: 1px solid #E7E4DD; border-radius: 14px; padding: 24px 28px; margin-bottom: 16px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px;">
          <h2 style="margin: 0; font-size: 15px; font-weight: 700;">演示主题</h2>
          <span style="font-size: 12px; color: #A9A399; font-family: Sora, sans-serif;">{{ charCount }} / 200</span>
        </div>
        <textarea value="{{ topic }}" onChange="{{ onTopicChange }}" rows="3" maxlength="200" placeholder="例如：2026 半年度经营分析与下半年战略规划，面向管理层汇报…" style="width: 100%; box-sizing: border-box; border: 1px solid #E7E4DD; border-radius: 10px; padding: 14px 16px; font-size: 15px; line-height: 1.7; resize: vertical; outline: none; color: #211F1C; background: #FDFDFC;" style-focus="border-color: oklch(0.45 0.11 272); box-shadow: 0 0 0 3px oklch(0.45 0.11 272 / 0.12);"></textarea>
        <sc-if value="{{ showSuggestions }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;">
            <sc-for list="{{ suggestions }}" as="sug" hint-placeholder-count="4">
              <button onClick="{{ sug.onPick }}" style="border: 1px solid #E7E4DD; background: #F6F5F2; color: #6B665D; font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-family: inherit;" style-hover="border-color: oklch(0.45 0.11 272); color: oklch(0.45 0.11 272); background: oklch(0.97 0.01 272);">{{ sug.text }}</button>
            </sc-for>
          </div>
        </sc-if>
      </section>

      <!-- Reference files -->
      <section style="background: #FFFFFF; border: 1px solid #E7E4DD; border-radius: 14px; padding: 24px 28px; margin-bottom: 16px;">
        <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;">
          <h2 style="margin: 0; font-size: 15px; font-weight: 700;">参考资料</h2>
          <span style="font-size: 12px; color: #A9A399;">可选 · 支持 PDF / Word / Excel</span>
        </div>
        <p style="margin: 0 0 14px; font-size: 13px; color: #8B857B;">AI 会阅读这些材料，提取数据与要点写入幻灯片。</p>
        <sc-for list="{{ files }}" as="f" hint-placeholder-count="0">
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid #EEEBE5; border-radius: 10px; margin-bottom: 8px; background: #FDFDFC;">
            <span style="width: 34px; height: 34px; border-radius: 8px; background: {{ f.color }}; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; font-family: Sora, sans-serif; flex-shrink: 0;">{{ f.ext }}</span>
            <span style="flex: 1; font-size: 14px; font-weight: 500;">{{ f.name }}</span>
            <span style="font-size: 12px; color: #A9A399; font-family: Sora, sans-serif;">{{ f.size }}</span>
            <button onClick="{{ f.onRemove }}" title="移除" style="border: none; background: none; color: #A9A399; cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 6px; line-height: 1;" style-hover="background: #F0EEE8; color: #211F1C;">✕</button>
          </div>
        </sc-for>
        <button onClick="{{ onAddFile }}" style="width: 100%; border: 1.5px dashed #D8D4CA; background: none; border-radius: 10px; padding: 16px; font-size: 13px; color: #8B857B; cursor: pointer; font-family: inherit;" style-hover="border-color: oklch(0.45 0.11 272); color: oklch(0.45 0.11 272); background: oklch(0.98 0.005 272);">＋ 点击添加文件，或拖拽到此处</button>
      </section>

      <!-- Template picker -->
      <section style="background: #FFFFFF; border: 1px solid #E7E4DD; border-radius: 14px; padding: 24px 28px; margin-bottom: 16px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px;">
          <h2 style="margin: 0; font-size: 15px; font-weight: 700;">模板</h2>
          <a href="Templates.dc.html" style="font-size: 13px; font-weight: 500;">浏览模板库 →</a>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;">
          <sc-for list="{{ tplCards }}" as="t" hint-placeholder-count="4">
            <button onClick="{{ t.onSelect }}" style="text-align: left; border: 2px solid {{ t.borderColor }}; background: {{ t.cardBg }}; border-radius: 12px; padding: 8px; cursor: pointer; font-family: inherit; transition: border-color .15s, box-shadow .15s; box-shadow: {{ t.shadow }};" style-hover="border-color: oklch(0.45 0.11 272);">
              <span style="display: block; aspect-ratio: 16/9; border-radius: 7px; background: {{ t.bg }}; position: relative; overflow: hidden; margin-bottom: 8px;">
                <span style="position: absolute; left: 12%; top: 30%; width: 55%; height: 9%; border-radius: 2px; background: {{ t.inkBar }}; display: block;"></span>
                <span style="position: absolute; left: 12%; top: 46%; width: 34%; height: 5%; border-radius: 2px; background: {{ t.subBar }}; display: block;"></span>
                <span style="position: absolute; left: 12%; bottom: 14%; width: 14%; height: 4%; border-radius: 2px; background: {{ t.accent }}; display: block;"></span>
              </span>
              <span style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 4px;">
                <span style="font-size: 13px; font-weight: 500; color: #211F1C;">{{ t.name }}</span>
                <sc-if value="{{ t.selected }}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 11px; color: oklch(0.45 0.11 272); font-weight: 700;">✓ 已选</span>
                </sc-if>
              </span>
            </button>
          </sc-for>
        </div>
      </section>

      <!-- Settings -->
      <section style="background: #FFFFFF; border: 1px solid #E7E4DD; border-radius: 14px; padding: 24px 28px; margin-bottom: 24px;">
        <h2 style="margin: 0 0 18px; font-size: 15px; font-weight: 700;">生成设置</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 32px;">
          <div>
            <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px;">
              <label style="font-size: 13px; color: #6B665D;">页数</label>
              <span style="font-family: Sora, sans-serif; font-size: 14px; font-weight: 600;">{{ pages }} 页</span>
            </div>
            <input type="range" min="5" max="30" step="1" value="{{ pages }}" onChange="{{ onPagesChange }}" style="width: 100%;">
            <div style="display: flex; justify-content: space-between; font-size: 11px; color: #A9A399; font-family: Sora, sans-serif;"><span>5</span><span>30</span></div>
          </div>
          <div>
            <label style="display: block; font-size: 13px; color: #6B665D; margin-bottom: 10px;">画面比例</label>
            <div style="display: flex; gap: 8px;">
              <button onClick="{{ onRatio169 }}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; border: 2px solid {{ r169Border }}; background: {{ r169Bg }}; color: {{ r169Color }};">
                <span style="width: 22px; height: 13px; border: 1.5px solid currentColor; border-radius: 2px; display: inline-block;"></span> 16 : 9
              </button>
              <button onClick="{{ onRatio43 }}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; border: 2px solid {{ r43Border }}; background: {{ r43Bg }}; color: {{ r43Color }};">
                <span style="width: 17px; height: 13px; border: 1.5px solid currentColor; border-radius: 2px; display: inline-block;"></span> 4 : 3
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Action bar -->
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 13px; color: #8B857B;">预计用时 {{ estTime }} · 生成过程中可随时编辑已完成页面</span>
        <button onClick="{{ onGenerate }}" disabled="{{ genDisabled }}" style="display: flex; align-items: center; gap: 10px; border: none; border-radius: 12px; padding: 14px 28px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: {{ genCursor }}; background: {{ genBg }}; color: #fff; box-shadow: 0 2px 8px oklch(0.45 0.11 272 / 0.25); transition: background .15s;">
          <span style="font-size: 16px;">✦</span> 开始生成
        </button>
      </div>

    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showSuggestions&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;创建页&quot;}, &quot;maxFiles&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 4, &quot;min&quot;: 1, &quot;max&quot;: 8, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;创建页&quot;}}">
class Component extends DCLogic {
  state = {
    topic: '',
    pages: 12,
    ratio: '16:9',
    files: [],
    templateId: 'obsidian',
    templates: []
  };

  componentDidMount() {
    import('./pptagent-data.js').then(mod => {
      this.DATA = mod;
      const saved = localStorage.getItem('pptagent.templateId');
      const cfgRaw = localStorage.getItem('pptagent.config');
      let patch = { templates: mod.TEMPLATES };
      if (saved && mod.TEMPLATES.some(t => t.id === saved && t.status === 'ready')) patch.templateId = saved;
      if (cfgRaw) {
        try {
          const cfg = JSON.parse(cfgRaw);
          if (cfg.topic) patch.topic = cfg.topic;
          if (cfg.pages) patch.pages = cfg.pages;
          if (cfg.ratio) patch.ratio = cfg.ratio;
          if (cfg.files) patch.files = cfg.files;
        } catch (e) {}
      }
      this.setState(patch);
    });
  }

  fileCatalog = [
    { name: '季度经营数据.xlsx', ext: 'XLS', size: '1.2 MB', color: '#1E7145' },
    { name: '产品介绍手册.docx', ext: 'DOC', size: '3.4 MB', color: '#2B579A' },
    { name: '行业研究报告.pdf', ext: 'PDF', size: '8.7 MB', color: '#B3261E' },
    { name: '品牌视觉规范.pdf', ext: 'PDF', size: '5.1 MB', color: '#B3261E' }
  ];

  renderVals() {
    const s = this.state;
    const accent = 'oklch(0.45 0.11 272)';
    const showSuggestions = this.props.showSuggestions ?? true;
    const maxFiles = this.props.maxFiles ?? 4;

    const suggestions = ['2026 半年度经营分析汇报', '新产品发布方案介绍', '团队季度 OKR 复盘', '行业趋势研究分享'].map(text => ({
      text, onPick: () => this.setState({ topic: text })
    }));

    const files = s.files.map((f, i) => Object.assign({}, f, {
      onRemove: () => this.setState({ files: s.files.filter((_, j) => j !== i) })
    }));

    const ready = (s.templates.length ? s.templates : []).filter(t => t.status === 'ready').slice(0, 4);
    const tplCards = ready.map(t => {
      const sel = t.id === s.templateId;
      return {
        name: t.name,
        bg: t.palette.bg,
        inkBar: t.palette.dark ? t.palette.ink : t.palette.primary,
        subBar: t.palette.dark ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.18)',
        accent: t.palette.dark ? t.palette.primary : t.palette.accent,
        selected: sel,
        borderColor: sel ? accent : '#E7E4DD',
        cardBg: sel ? 'oklch(0.98 0.005 272)' : '#FFFFFF',
        shadow: sel ? '0 0 0 3px oklch(0.45 0.11 272 / 0.10)' : 'none',
        onSelect: () => {
          this.setState({ templateId: t.id });
          localStorage.setItem('pptagent.templateId', t.id);
        }
      };
    });

    const hasTopic = s.topic.trim().length > 0;
    const is169 = s.ratio === '16:9';
    const mins = Math.max(1, Math.round(s.pages * 5 / 60));

    return {
      topic: s.topic,
      charCount: s.topic.length,
      onTopicChange: e => this.setState({ topic: e.target.value }),
      showSuggestions,
      suggestions,
      files,
      onAddFile: () => {
        if (s.files.length >= maxFiles) return;
        const next = this.fileCatalog[s.files.length % this.fileCatalog.length];
        this.setState({ files: s.files.concat([next]) });
      },
      tplCards,
      pages: s.pages,
      onPagesChange: e => this.setState({ pages: Number(e.target.value) }),
      onRatio169: () => this.setState({ ratio: '16:9' }),
      onRatio43: () => this.setState({ ratio: '4:3' }),
      r169Border: is169 ? accent : '#E7E4DD',
      r169Bg: is169 ? 'oklch(0.98 0.005 272)' : '#FFFFFF',
      r169Color: is169 ? accent : '#6B665D',
      r43Border: !is169 ? accent : '#E7E4DD',
      r43Bg: !is169 ? 'oklch(0.98 0.005 272)' : '#FFFFFF',
      r43Color: !is169 ? accent : '#6B665D',
      estTime: '约 ' + mins + ' 分钟',
      genDisabled: !hasTopic,
      genCursor: hasTopic ? 'pointer' : 'not-allowed',
      genBg: hasTopic ? accent : '#C9C4BA',
      onGenerate: () => {
        if (!hasTopic) return;
        localStorage.setItem('pptagent.config', JSON.stringify({
          topic: s.topic.trim(), pages: s.pages, ratio: s.ratio,
          files: s.files, templateId: s.templateId, fresh: true
        }));
        location.href = 'Workspace.dc.html';
      }
    };
  }
}
</script>
</body>
</html>
